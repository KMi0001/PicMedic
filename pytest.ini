[pytest]
# 테스트는 tests/ 아래에만 있다. experiments/ 밑에는 프로토타입이 각자
# 가상환경(.venv)까지 들고 있어서, 기본 수집 경로를 안 정해두면 pytest가
# 그 안의 서드파티 패키지 테스트까지 긁어온다.
testpaths = tests

# tests/에 __init__.py가 있어 패키지로 잡히므로, import는 저장소 루트 기준
# (tests.helpers)으로 한다 — tests/helpers.py docstring 참고.
python_files = test_*.py
python_functions = test_*

# 각 테스트가 [PASS]/[SKIP] 줄을 직접 찍는다(예전 구조를 그대로 유지) —
# 실패했을 때 어느 단언까지 갔는지 보이도록 출력을 잡아두지 않는다.
addopts = -ra --tb=short
